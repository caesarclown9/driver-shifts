name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: uv sync --frozen
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t driver-shifts .
      - name: Smoke test the image
        run: |
          docker run -d --name app -p 8000:8000 driver-shifts
          for i in $(seq 1 30); do curl -sf localhost:8000/api/days > /dev/null && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q "Дневник смен"
          body='{"started_at":"2026-10-06T10:00:00+06:00","ended_at":"2026-10-06T10:20:00+06:00","amount":"300","payment":"card","commission":"45"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/trips -H 'content-type: application/json' -d "$body")" = 201
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/trips -H 'content-type: application/json' -d "$body")" = 200
